
services:
  web:
    build: .
    volumes:
      - jujiedso_docker_media:/app/media
      - jujiedso_docker_static:/app/staticfiles
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    command:
      - sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - jujiedso_docker_static:/usr/share/nginx/html/static:ro
      - jujiedso_docker_media:/usr/share/nginx/html/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - default
      - shared_proxy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.docker}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - jujiedso_docker_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  collector:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    command: ["python", "manage.py", "monitor_pppoe"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  jujiedso_docker_pgdata:
  jujiedso_docker_media:
  jujiedso_docker_static:

networks:
  default:
  shared_proxy:
    external: true
    name: shared_proxy
