
<div id="client-modal" class="fixed inset-0 z-[100] hidden items-center justify-center overflow-hidden bg-black/40 px-4 py-3">
    <div class="flex h-[calc(100vh-1.5rem)] max-h-[calc(100vh-1.5rem)] w-full max-w-2xl flex-col overflow-hidden rounded-2xl bg-white shadow-xl">
        <div class="flex shrink-0 items-center justify-between border-b border-gray-200 px-5 py-3">
            <div>
                <h2 class="text-lg font-semibold text-gray-900">PPPoE Client Information</h2>
                <p class="text-xs text-gray-500">Client connection details</p>
            </div>
            <button id="close-client-modal" type="button" class="text-xl text-gray-400 hover:text-gray-700">&times;</button>
        </div>

        <div class="min-h-0 flex-1 overflow-hidden px-5 py-3">
            <div class="flex h-full min-h-0 flex-col gap-3">
                <div class="shrink-0 grid grid-cols-2 gap-1">
                    <div class="rounded-lg bg-gray-50 p-2.5">
                        <p class="text-[11px] font-medium text-gray-500">Username</p>
                        <p id="modal-username" class="mt-1 break-all text-sm font-semibold text-gray-900">-</p>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-2.5">
                        <p class="text-[11px] font-medium text-gray-500">MAC Address</p>
                        <p id="modal-mac" class="mt-1 break-all text-sm font-semibold text-gray-900">-</p>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-2.5">
                        <p class="text-[11px] font-medium text-gray-500">Status</p>
                        <p id="modal-status" class="mt-1 text-sm font-semibold text-gray-900">-</p>
                    </div>
                    <div class="rounded-lg bg-gray-50 p-2.5">
                        <p class="text-[11px] font-medium text-gray-500">Current Duration</p>
                        <p id="modal-duration" class="mt-1 text-sm font-bold text-gray-900">-</p>
                    </div>
                </div>

                <div class="shrink-0 rounded-lg border border-blue-100 bg-blue-50 p-2.5">
                    <p class="text-[11px] font-medium text-blue-600">Active AC</p>
                    <p id="modal-active-ac" class="mt-1 text-sm font-bold text-blue-700">-</p>
                </div>

                <div class="flex min-h-0 flex-1 flex-col rounded-lg border border-gray-200">
                    <div class="flex shrink-0 items-center justify-between border-b border-gray-200 px-4 py-2.5">
                        <div>
                            <p class="text-sm font-semibold text-gray-900">Connection History</p>
                            <p class="text-[10px] text-gray-500">Last 24 hours</p>
                        </div>
                        <span id="modal-history-count" class="rounded-full bg-gray-100 px-2 py-1 text-[10px] font-medium text-gray-600">0 connections</span>
                    </div>

                    <div id="modal-connection-history" class="min-h-0 flex-1 overflow-y-auto px-3 py-3">
                        <div id="modal-history-empty" class="py-6 text-center">
                            <p class="text-sm text-gray-400">No connection history available</p>
                        </div>
                    </div>
                </div>

                <div id="client-modal-error" class="hidden shrink-0 text-sm text-red-600"></div>
            </div>
        </div>
    </div>
</div>
