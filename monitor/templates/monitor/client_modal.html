<div id="client-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 px-4">

    <div class="w-full max-w-md rounded-2xl bg-white shadow-xl">

        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">

            <div>
                <h2 class="text-lg font-semibold text-gray-900">
                    PPPoE Client Information
                </h2>

                <p class="text-xs text-gray-500">
                    Client connection details
                </p>
            </div>

            <button id="close-client-modal" type="button" class="text-xl text-gray-400 hover:text-gray-700">
                &times;
            </button>

        </div>

        <div class="space-y-4 px-5 py-5">

            <div class="grid grid-cols-2 gap-3">

                <div class="rounded-lg bg-gray-50 p-3">
                    <p class="text-[11px] font-medium text-gray-500">Username</p>
                    <p id="modal-username" class="mt-1 break-all text-sm font-semibold text-gray-900">-</p>
                </div>

                <div class="rounded-lg bg-gray-50 p-3">
                    <p class="text-[11px] font-medium text-gray-500">MAC Address</p>
                    <p id="modal-mac" class="mt-1 break-all text-sm font-semibold text-gray-900">-</p>
                </div>

                <div class="rounded-lg bg-gray-50 p-3">
                    <p class="text-[11px] font-medium text-gray-500">Up Time</p>
                    <p id="modal-up-time" class="mt-1 text-sm font-semibold text-gray-900">-</p>
                </div>

                <div class="rounded-lg bg-gray-50 p-3">
                    <p class="text-[11px] font-medium text-gray-500">Last Down Time</p>
                    <p id="modal-down-time" class="mt-1 text-sm font-semibold text-gray-900">-</p>
                </div>

            </div>

            <div class="rounded-lg border border-gray-200 p-3">

                <p class="text-[11px] font-medium text-gray-500">
                    Duration
                </p>

                <p id="modal-duration" class="mt-1 text-lg font-bold text-gray-900">
                    -
                </p>

            </div>

            <div class="rounded-lg border border-blue-100 bg-blue-50 p-3">

                <p class="text-[11px] font-medium text-blue-600">
                    Active AC
                </p>

                <p id="modal-active-ac" class="mt-1 text-sm font-bold text-blue-700">
                    -
                </p>

            </div>

        </div>

        <div id="client-modal-error" class="hidden px-5 pb-5 text-sm text-red-600"></div>

    </div>

</div>
