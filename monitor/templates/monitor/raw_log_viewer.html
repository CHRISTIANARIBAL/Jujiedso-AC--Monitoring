{% extends "monitor/base.html" %}

{% block title %}{{ filename }}{% endblock %}

{% block page_title %}Raw MikroTik Logs{% endblock %}

{% block content %}

<div class="space-y-5">

    <!-- HEADER -->

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

        <div>
            <h1 class="text-2xl font-bold text-gray-900">
                {{ filename }}
            </h1>

            <p class="mt-1 text-sm text-gray-500">
                {{ ac_name }} · Raw MikroTik /log/print archive
            </p>
        </div>

        <a
            href="{% url 'raw_logs' %}"
            class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50"
        >
            ← Back to Raw Logs
        </a>

    </div>


    <!-- RAW LOG PANEL -->

    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">

        <div class="flex items-center justify-between border-b border-gray-200 bg-gray-50 px-4 py-3">

            <div class="flex items-center gap-2">

                <span class="h-2 w-2 rounded-full bg-green-500"></span>

                <span class="text-sm font-semibold text-gray-900">
                    RAW LOG
                </span>

            </div>

            <span class="text-xs text-gray-500">
                {{ filename }}
            </span>

        </div>


        <!-- LOG CONTENT -->

        <div class="max-h-[75vh] overflow-auto bg-gray-950">

            <pre class="whitespace-pre-wrap break-words px-5 py-4 font-mono text-xs leading-6 text-gray-200">{{ log_content }}</pre>

        </div>

    </div>

</div>

{% endblock %}
